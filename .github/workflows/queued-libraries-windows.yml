name: Queued libraries Windows runtime

on:
  push:
    branches: [ci/queued-libraries-windows]
    paths: [.github/workflows/queued-libraries-windows.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: queued-libraries-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CONFIGURE: >-
    -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
    -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
    -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

jobs:
  windows-msys2:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: getnameinfo
            ref: 00efcd24909c9a1e7efc36f75f9f447536c5b3bb
            targets: "guest_resolver_tests guest_raw_resolver_tests guest_resolver_socket_types_tests guest_service_database_tests"
            tests: "^(guest_resolver|guest_raw_resolver|guest_resolver_socket_types|guest_service_database)$"
          - name: bio
            ref: 32cc2e02a8ccdfd0c4bd88747539a0f07bf250f8
            targets: "guest_libressl3_bio_flags_tests guest_crypto_memcmp_tests guest_libressl3_stack_tests guest_libressl3_cipher_tests guest_libressl3_digest_context_tests"
            tests: "^(guest_libressl3_bio_flags(_nid)?|guest_crypto_memcmp|guest_libressl3_stack|guest_libressl3_cipher|guest_libressl3_digest_context)$"
          - name: icu
            ref: 7262860a62ab15736b8639f14b15db9ba5b40393
            targets: "guest_icu_termination_tests guest_icu_version_tests guest_icu_utf8_tests guest_icu_unescape_tests"
            tests: "^(guest_icu_termination(_nid)?|guest_icu_version|guest_icu_utf8|guest_icu_unescape)$"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - id: submodules
        name: Key the submodules on their commits
        run: |
          echo "key=$(git ls-files -s | awk '$1 == "160000" { print $2, $4 }' | cat - .gitmodules | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "ffmpeg=$(git rev-parse HEAD:3rdparty/ffmpeg-core)" >> "$GITHUB_OUTPUT"
      - id: submodule-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/submodule-gitdirs.tar
          key: submodule-gitdirs-${{ runner.os }}-${{ steps.submodules.outputs.key }}
      - name: Check out the submodules
        run: |
          if [ -f "$RUNNER_TEMP/submodule-gitdirs.tar" ]; then tar --force-local -xf "$RUNNER_TEMP/submodule-gitdirs.tar"; fi
          git submodule update --init --recursive --depth 1 --jobs 8
      - if: steps.submodule-cache.outputs.cache-hit != 'true'
        run: tar --force-local -cf "$RUNNER_TEMP/submodule-gitdirs.tar" .git/modules
      - if: steps.submodule-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/submodule-gitdirs.tar
          key: submodule-gitdirs-${{ runner.os }}-${{ steps.submodules.outputs.key }}
      - name: Use the CA bundle of Git for Windows
        run: |
          for prefix in ucrt64 mingw64; do
            bundle="C:/Program Files/Git/$prefix/etc/ssl/certs/ca-bundle.crt"
            if [ -f "$bundle" ]; then echo "SSL_CERT_FILE=$bundle" >> "$GITHUB_ENV"; exit 0; fi
          done
          echo "::error::No CA bundle found in Git for Windows"; exit 1
      - id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: Add-Content -LiteralPath $env:GITHUB_PATH -Value "$env:MSYS2_LOCATION\ucrt64\bin"
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: windows-msys2
          save: ${{ github.ref == 'refs/heads/main' }}
          evict-old-files: job
      - id: ffmpeg-cache
        uses: actions/cache/restore@v6
        with:
          path: build/externals
          key: ffmpeg-${{ runner.os }}-${{ steps.submodules.outputs.ffmpeg }}
      - shell: cmd
        run: cmake -S . -B build %CONFIGURE% "-DANYPS5_AGC_EXECUTION_TESTS=F16ToF32Unpack;F64FmaSubnormals;RegistrationPrepareShutdown"
      - if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: build/externals
          key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}
      - name: Check that every test executable is registered with ctest
        shell: cmd
        run: python tools/check_test_registration.py build
      - name: Record exact tested contribution
        run: |
          echo "Contribution: ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - name: Build affected libraries and actual guest tests
        shell: cmd
        run: cmake --build build --parallel 4 --target ${{ matrix.targets }}
      - name: Execute focused Windows runtime tests
        shell: cmd
        run: ctest --test-dir build -R "${{ matrix.tests }}" --no-tests=error --output-on-failure --timeout 30 --output-log "%GITHUB_WORKSPACE%/build/focused.log" --output-junit "%GITHUB_WORKSPACE%/build/focused.xml"
      - name: Report tests slower than 30 s
        if: ${{ !cancelled() }}
        run: |
          [ -f build/focused.log ] || exit 0
          awk '/Test +#[0-9]+: / && $NF == "sec" { for (i = 1; i <= NF; i++) if ($i ~ /^#[0-9]+:$/) name = $(i + 1); t = $(NF - 1) + 0; if (t > max[name]) max[name] = t }
            END { for (name in max) if (max[name] > 30) printf "::warning title=Slow test::%s took %.1f s on %s; tests must finish in 30 s (CONTRIBUTING.md)\n", name, max[name], ENVIRON["RUNNER_OS"] }' build/focused.log
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: queued-${{ matrix.name }}-windows
          path: |
            build/focused.log
            build/focused.xml
          if-no-files-found: ignore
